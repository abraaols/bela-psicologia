<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="blob1" cx="0%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#f5e8e2;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#faf8f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="100%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#f0ecf8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#faf8f6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#faf8f6"/>

  <!-- Blobs -->
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>

  <!-- Dot grid -->
  <g fill="#ddd5cc" opacity="0.5">
    <circle cx="80" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/><circle cx="240" cy="80" r="1.5"/>
    <circle cx="80" cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/>
    <circle cx="900" cy="80" r="1.5"/><circle cx="980" cy="80" r="1.5"/><circle cx="1060" cy="80" r="1.5"/><circle cx="1140" cy="80" r="1.5"/>
    <circle cx="900" cy="160" r="1.5"/><circle cx="980" cy="160" r="1.5"/><circle cx="1060" cy="160" r="1.5"/><circle cx="1140" cy="160" r="1.5"/>
    <circle cx="80" cy="470" r="1.5"/><circle cx="160" cy="470" r="1.5"/><circle cx="240" cy="470" r="1.5"/>
    <circle cx="80" cy="550" r="1.5"/><circle cx="160" cy="550" r="1.5"/><circle cx="240" cy="550" r="1.5"/>
    <circle cx="900" cy="470" r="1.5"/><circle cx="980" cy="470" r="1.5"/><circle cx="1060" cy="470" r="1.5"/><circle cx="1140" cy="470" r="1.5"/>
    <circle cx="900" cy="550" r="1.5"/><circle cx="980" cy="550" r="1.5"/><circle cx="1060" cy="550" r="1.5"/><circle cx="1140" cy="550" r="1.5"/>
  </g>

  <!-- Card shadow -->
  <rect x="326" y="116" width="556" height="408" rx="28" fill="#e8ddd5" opacity="0.5"/>

  <!-- Card -->
  <rect x="320" y="110" width="556" height="408" rx="28" fill="white"/>
  <rect x="320" y="110" width="556" height="408" rx="28" fill="none" stroke="#ede5de" stroke-width="1.5"/>

  <!-- Decorative rings -->
  <circle cx="598" cy="270" r="120" fill="none" stroke="#c2785e" stroke-width="1" opacity="0.15"/>
  <circle cx="598" cy="270" r="94" fill="none" stroke="#c2785e" stroke-width="1" opacity="0.2"/>
  <circle cx="598" cy="270" r="68" fill="none" stroke="#c2785e" stroke-width="1" opacity="0.25"/>

  <!-- B circle bg -->
  <circle cx="598" cy="270" r="52" fill="#f5e8e2"/>

  <!-- B letter -->
  <text
    x="598"
    y="296"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="64"
    font-weight="400"
    fill="#c2785e"
  >B</text>

  <!-- Brand name -->
  <text
    x="598"
    y="374"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="28"
    font-weight="400"
    fill="#1a1512"
    letter-spacing="1"
  >Bela</text>

  <!-- Eyebrow line -->
  <line x1="498" y1="392" x2="540" y2="392" stroke="#c2785e" stroke-width="1"/>
  <text
    x="598"
    y="396"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="10"
    fill="#c2785e"
    letter-spacing="3"
  >PSICOLOGIA</text>
  <line x1="656" y1="392" x2="698" y2="392" stroke="#c2785e" stroke-width="1"/>

  <!-- Bottom tagline -->
  <text
    x="598"
    y="468"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="15"
    font-style="italic"
    fill="#7a6e68"
  >Um espaço para entender emoções e a si mesma.</text>

  <!-- URL badge -->
  <rect x="499" y="490" width="198" height="28" rx="14" fill="#f5e8e2"/>
  <text
    x="598"
    y="509"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#c2785e"
    letter-spacing="0.5"
  >belapsi.com.br</text>
</svg>
