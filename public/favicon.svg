<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;display=swap');
    </style>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#faf8f6"/>
  <!-- Soft ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#c2785e" stroke-width="0.8" opacity="0.3"/>
  <!-- Inner filled circle -->
  <circle cx="32" cy="32" r="22" fill="#f5e8e2"/>
  <!-- B letter -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="30"
    font-weight="500"
    fill="#c2785e"
    letter-spacing="-0.5"
  >B</text>
</svg>
